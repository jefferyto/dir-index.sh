name: Windows MSYS2 Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  windows-msys2:
    name: ${{ matrix.shell.name }}
    strategy:
      matrix:
        shell:
          - name: dash
          - name: bash
          - name: busybox ash
            package: busybox
          - name: zsh
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            dash
            ${{ matrix.shell.package || matrix.shell.name }}
      - name: Set up environment
        run: |
          echo "MSYSTEM=UCRT64" >> "$GITHUB_ENV"
          echo "MSYS2_PATH_TYPE=minimal" >> "$GITHUB_ENV"
          echo "CHERE_INVOKING=1" >> "$GITHUB_ENV"
          echo "$MSYS2_LOCATION/usr/bin" >> "$GITHUB_PATH"
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
      - uses: jefferyto/shellspec-action@v1
        with:
          shellspec-shell: dash
          artifact-suffix: >-
            ${{
              format(
                '_{0}_{1}',
                github.job,
                matrix.shell.name
              )
            }}
          shell: ${{ matrix.shell.name }}
          kcov: >-
            ${{
              matrix.shell.name == 'bash' ||
                matrix.shell.name == 'zsh'
            }}
