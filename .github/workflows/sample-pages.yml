name: Sample Pages

on:
  push:
    tags:
      - "[0-9]*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Generate pages
        run: |
          ./bootstrap
          cd build
          ../configure --prefix="$PWD"
          make install
          mkdir -p pages/sample
          for css in share/dir-index-sh/styles/*.css; do
            style="${css##*/}"
            style="${style%.css}"
            cp -rp ../sample "pages/sample/$style"
            bin/dir-index.sh -y "$style" -X "/dir-index.sh/sample/$style" "pages/sample/$style"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          name: sample-pages-run-${{ github.run_attempt }}
          path: build/pages
          retention-days: ${{ github.event_name == 'push' && 1 || 90 }}

  deploy:
    name: Deploy
    permissions:
      id-token: write
      pages: write
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: sample-pages-run-${{ github.run_attempt }}
