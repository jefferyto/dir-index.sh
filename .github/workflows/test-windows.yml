name: Windows Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  windows:
    name: ${{ matrix.name }} / ${{ matrix.shell }}
    strategy:
      matrix:
        include:
          - { name: Git Bash, id: windows-gitbash, shell: sh }
          - { name: Git Bash, id: windows-gitbash, shell: dash }
          - { name: Git Bash, id: windows-gitbash, shell: bash }

          - { name: MSYS2, id: windows-msys2, shell: dash }
          - { name: MSYS2, id: windows-msys2, shell: bash }
          - { name: MSYS2, id: windows-msys2, shell: busybox ash, package: busybox }
          - { name: MSYS2, id: windows-msys2, shell: zsh }

          - { name: Cygwin, id: windows-cygwin, shell: dash }
          - { name: Cygwin, id: windows-cygwin, shell: bash }
          - { name: Cygwin, id: windows-cygwin, shell: ash, package: busybox }
          - { name: Cygwin, id: windows-cygwin, shell: mksh }
          - { name: Cygwin, id: windows-cygwin, shell: zsh }

      fail-fast: false
    runs-on: windows-latest
    steps:
      - if: ${{ matrix.id == 'windows-msys2' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            ${{ matrix.package || matrix.shell }}
            jq

      - if: ${{ matrix.id == 'windows-cygwin' }}
        uses: cygwin/cygwin-install-action@v7
        with:
          packages: |
            ${{ matrix.package || matrix.shell }}

      - uses: actions/checkout@v7

      - uses: jefferyto/shellspec-action@v2
        with:
          shellspec-shell: dash
          artifact-suffix: ${{ format('_{0}_{1}', matrix.id, matrix.shell) }}
          shell: ${{ matrix.shell }}
          kcov: ${{ matrix.shell == 'bash' || matrix.shell == 'zsh' }}
