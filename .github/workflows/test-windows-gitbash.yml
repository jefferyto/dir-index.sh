name: Windows Git Bash Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  windows-gitbash:
    name: ${{ matrix.shell.name }}
    strategy:
      matrix:
        shell:
          - name: sh
          - name: dash
          - name: bash
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jefferyto/shellspec-action@v1
        with:
          shellspec-shell: dash
          artifact-suffix: >-
            ${{
              format(
                '_{0}_{1}',
                github.job,
                matrix.shell.name
              )
            }}
          shell: ${{ matrix.shell.name }}
          kcov: >-
            ${{
              matrix.shell.name == 'bash' ||
                matrix.shell.name == 'zsh'
            }}
