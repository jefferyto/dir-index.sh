name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-slim
          - ubuntu-latest
          - macos-latest
          - windows-latest
        shell:
          - sh
          - bash
          - dash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install dependencies on macOS
        if: ${{ runner.os == 'macos' }}
        run: |
          brew update-if-needed
          brew install findutils gnu-sed uutils-coreutils
      - uses: actions/checkout@v7
      - uses: jefferyto/shellspec-action@v1
        with:
          artifact-suffix: ${{ format('-{0}-{1}', matrix.os, matrix.shell) }}
          shell: ${{ matrix.shell }}
          kcov: "true"
