name: macOS Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  macos:
    name: ${{ matrix.name }} / ${{ matrix.shell }}
    strategy:
      matrix:
        include:
          - { name: Default, id: macos, shell: sh }
          - { name: Default, id: macos, shell: dash }
          - { name: Default, id: macos, shell: bash }
          - { name: Default, id: macos, shell: zsh }

          - { name: Homebrew, id: macos-homebrew, shell: dash, package: dash-shell }
          - { name: Homebrew, id: macos-homebrew, shell: bash }
          - { name: Homebrew, id: macos-homebrew, shell: mksh }
          - { name: Homebrew, id: macos-homebrew, shell: zsh }

          - { name: MacPorts, id: macos-macports, shell: dash }
          - { name: MacPorts, id: macos-macports, shell: bash }
          - { name: MacPorts, id: macos-macports, shell: mksh }
          - { name: MacPorts, id: macos-macports, shell: yash }
          - { name: MacPorts, id: macos-macports, shell: zsh }

      fail-fast: false
    runs-on: macos-latest
    steps:
      - if: ${{ matrix.id == 'macos' || matrix.id == 'macos-homebrew' }}
        name: Install dependencies (Default / Homebrew)
        run: |
          brew update-if-needed
          brew install coreutils findutils gnu-sed uutils-coreutils

      - if: ${{ matrix.id == 'macos-homebrew' }}
        name: Install shell (Homebrew)
        run: |
          brew update-if-needed
          brew install dash-shell "$SHELL_PACKAGE"
        env:
          SHELL_PACKAGE: ${{ matrix.package || matrix.shell }}

      - if: ${{ matrix.id == 'macos-macports' }}
        uses: ukiryu/setup-macports@v1
        with:
          install-ports: >-
            coreutils coreutils-uutils findutils gsed
            dash ${{ matrix.package || matrix.shell }}

      - uses: actions/checkout@v7

      - uses: jefferyto/shellspec-action@v2
        with:
          shellspec-shell: dash
          artifact-suffix: ${{ format('_{0}_{1}', matrix.id, matrix.shell) }}
          shell: ${{ matrix.shell }}
          kcov: ${{ matrix.shell == 'bash' || matrix.shell == 'zsh' }}
