name: Ubuntu Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: ${{ matrix.name }} / ${{ matrix.shell }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 24.04, os: ubuntu-24.04, shell: dash }
          - { name: 24.04, os: ubuntu-24.04, shell: bash }
          - { name: 24.04, os: ubuntu-24.04, shell: busybox ash, package: busybox-static }
          - { name: 24.04, os: ubuntu-24.04, shell: mksh }
          - { name: 24.04, os: ubuntu-24.04, shell: yash }
          - { name: 24.04, os: ubuntu-24.04, shell: zsh }

          - { name: 26.04, os: ubuntu-26.04, shell: dash }
          - { name: 26.04, os: ubuntu-26.04, shell: bash }
          - { name: 26.04, os: ubuntu-26.04, shell: busybox ash, package: busybox-static }
          - { name: 26.04, os: ubuntu-26.04, shell: mksh }
          - { name: 26.04, os: ubuntu-26.04, shell: yash }
          - { name: 26.04, os: ubuntu-26.04, shell: zsh }

    steps:
      - name: Install shell
        run: |
          sudo apt-get update
          sudo apt-get install "$SHELL_PACKAGE"
        env:
          SHELL_PACKAGE: ${{ matrix.package || matrix.shell }}

      - uses: actions/checkout@v7

      - uses: jefferyto/shellspec-action@v2
        with:
          shellspec-shell: dash
          artifact-suffix: ${{ format('_{0}_{1}', matrix.os, matrix.shell) }}
          shell: ${{ matrix.shell }}
          kcov: ${{ matrix.shell == 'bash' || matrix.shell == 'zsh' }}
